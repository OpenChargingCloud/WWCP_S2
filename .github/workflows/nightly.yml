name: Nightly

# The counterpart to ci.yml. That workflow gates every push and leaves out what a
# hosted runner cannot answer reliably: the real-clock Timing tests and the Multicast
# DNS/DNS-SD tests over real UDP sockets. Those are still worth running — just not
# against a merge.
#
# It also answers a question the gate structurally cannot: ci.yml pins Styx and Hermod
# to the commits this repository was last built against, so nothing upstream can turn
# it red — and nothing upstream can turn it green again either. The second job below
# builds the same code against Styx and Hermod master and reports the drift.
#
# Two things worth knowing about scheduled workflows: they only ever run on the default
# branch (master here), and GitHub disables them after 60 days without any repository
# activity. If this stops reporting, that is the first thing to check.
on:
  schedule:
    # 03:37 UTC. Not on the hour, because GitHub's scheduler is busiest then and delays
    # runs by tens of minutes; and after Hermod's 02:17, so on a morning where both are
    # red, the upstream verdict is already in.
    - cron: '37 3 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  # The same pins as ci.yml — bump them there, they are copied here.
  STYX_REF: 0f40d614a9b3f7562193f2ed6ae94fb4685fa6fe
  HERMOD_REF: 368fa179ace8ccf0f2ea662bfed75a3e8044cda3

jobs:

  full-suite:
    # The same two legs as ci.yml: windows-latest, and Debian 13 in a bare debian:13
    # container. See ci.yml for why it is exactly these two.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            leg: windows-latest
          - os: ubuntu-latest
            container: debian:13
            leg: debian-13-container
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: WWCP_S2

      - uses: actions/checkout@v7
        with:
          repository: Vanaheimr/Styx
          ref: ${{ env.STYX_REF }}
          path: Styx

      - uses: actions/checkout@v7
        with:
          repository: Vanaheimr/Hermod
          ref: ${{ env.HERMOD_REF }}
          path: Hermod

      - name: Install .NET prerequisites (Debian container)
        if: runner.os == 'Linux'
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl libicu76 libssl3t64 libstdc++6 tzdata

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        working-directory: WWCP_S2
        run: |
          dotnet build WWCP_S2Tests/WWCP_S2Tests.csproj --configuration Release
          dotnet build WWCP_S2_Samples/WWCP_S2_Samples.csproj --configuration Release

      # The gated set plus the Timing category: pings, HTTP timeouts and token buckets
      # against the real clock, with generous margins. Fatal — a red here is a real
      # regression. Repeating the gated tests is worth the minutes on top of that: they
      # are the ones that would expose a test that only fails sometimes.
      - name: Test (everything except multicast)
        timeout-minutes: 60
        working-directory: WWCP_S2
        run: dotnet test WWCP_S2Tests/WWCP_S2Tests.csproj --configuration Release --no-build --filter "TestCategory!=Multicast" --logger "console;verbosity=normal" --logger "trx;LogFileName=${{ matrix.leg }}.trx" --results-directory artifacts

      # DNS-SD advertise, browse and `.local` resolution over real UDP multicast sockets
      # on a private port (PLAN.md §8, D12). Informational on purpose: whether two sockets
      # in one process see each other's multicast is a property of the runner's network,
      # not of this code — in a container it is the docker bridge, on the Windows runner
      # the loopback adapter. The test itself degrades gracefully and reports "no multicast
      # capable network interface" as an ignore rather than a failure, so the interesting
      # reading of this step is the counter below: a night where it runs AND fails is worth
      # investigating, a night where it is ignored says nothing.
      - name: Multicast DNS-SD (informational)
        continue-on-error: true
        timeout-minutes: 20
        working-directory: WWCP_S2
        shell: bash
        run: |
          set +e
          dotnet test WWCP_S2Tests/WWCP_S2Tests.csproj --configuration Release --no-build \
            --filter "TestCategory=Multicast" --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=${{ matrix.leg }}-multicast.trx" --results-directory artifacts 2>&1 | tee multicast.txt
          {
            echo '## Multicast DNS-SD (informational, ${{ matrix.leg }})'
            echo
            echo 'Network-dependent: a failure here can also mean the runner does not carry multicast.'
            echo
            echo '```'
            grep -E "Passed!|Failed!|Skipped!|Total tests|Passed:|Failed:|Skipped:" multicast.txt || tail -5 multicast.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      # Two .trx files per leg: the fatal set and the multicast probe. continue-on-error on
      # the probe step means it counts as successful here, so !cancelled() collects both
      # files even on a night the probe went red.
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.leg }}
          path: WWCP_S2/artifacts/*.trx

  unpinned:
    # What ci.yml cannot see. Its pins are what keep a gate here from reporting other
    # repositories' work as this repository's breakage — but they also mean the gate stays
    # green while the pin ages, and a stale pin does not announce itself: this one sat two
    # phases behind until a run failed to compile because the pinned Hermod predated the
    # Multicast DNS work that phase 9 needs.
    #
    # So: the same code against Styx and Hermod master, and the resolved SHAs in the step
    # summary, ready to be pasted into ci.yml. Informational — a red here means "upstream
    # moved", which is news, not a regression of this repository. One leg is enough for
    # that question; a pin bump is then verified by the normal gate on both platforms.
    continue-on-error: true
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - uses: actions/checkout@v7
        with:
          path: WWCP_S2

      - uses: actions/checkout@v7
        id: styx
        with:
          repository: Vanaheimr/Styx
          path: Styx

      - uses: actions/checkout@v7
        id: hermod
        with:
          repository: Vanaheimr/Hermod
          path: Hermod

      - name: Install .NET prerequisites (Debian container)
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl libicu76 libssl3t64 libstdc++6 tzdata

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Report the drift
        shell: bash
        run: |
          {
            echo '## Styx and Hermod master'
            echo
            echo '| Repository | Pinned in ci.yml | master tonight |'
            echo '|---|---|---|'
            echo "| Styx | ${STYX_REF} | ${{ steps.styx.outputs.commit }} |"
            echo "| Hermod | ${HERMOD_REF} | ${{ steps.hermod.outputs.commit }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build against master
        working-directory: WWCP_S2
        run: |
          dotnet build WWCP_S2Tests/WWCP_S2Tests.csproj --configuration Release
          dotnet build WWCP_S2_Samples/WWCP_S2_Samples.csproj --configuration Release

      - name: Test against master
        timeout-minutes: 60
        working-directory: WWCP_S2
        run: dotnet test WWCP_S2Tests/WWCP_S2Tests.csproj --configuration Release --no-build --filter "TestCategory!=Multicast" --logger "console;verbosity=normal" --logger "trx;LogFileName=unpinned.trx" --results-directory artifacts

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-unpinned
          path: WWCP_S2/artifacts/*.trx
